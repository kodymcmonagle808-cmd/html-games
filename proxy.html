<!-- Replace with your HTML Code 
(Leave empty if not needed) --><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Proxy Gateway</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }

        h1 {
            color: cyan;
        }

        .proxy-box {
            margin-top: 40px;
        }

        input[type="text"] {
            width: 60%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            background: cyan;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        iframe {
            margin-top: 30px;
            width: 95%;
            height: 70vh;
            border: 2px solid cyan;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Universal Proxy Gateway</h1>
    <p>Access websites through proxy rendering</p>
</header>

<div class="proxy-box">
    <input type="text" id="urlInput" placeholder="Enter website URL">
    <button onclick="loadSite()">Access</button>
</div>

<iframe id="proxyFrame"></iframe>

<script>
    function loadSite() {
        let url = document.getElementById("urlInput").value;

        if (!url.startsWith("http")) {
            url = "https://" + url;
        }

        const proxyPrefix = "https://corsproxy.io/?";
        document.getElementById("proxyFrame").src = proxyPrefix + encodeURIComponent(url);
    }
</script>

</body>
</html>
